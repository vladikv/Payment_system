{% extends 'base.html' %}
{% load static %}
{% block title %}Password Reset Complete — PayFlow{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-header">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">⬡</div>
        <h1>PayFlow</h1>
    </div>

    <div class="card">
        <h2 style="margin-bottom: 0.5rem;">Password reset complete</h2>
        <p style="color: var(--muted); font-size: 14px;">
            Your password has been set. You can now sign in with your new password.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-block" style="margin-top: 1rem;">Sign In</a>
    </div>
</div>
{% endblock %}
